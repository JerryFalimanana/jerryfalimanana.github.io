<footer class="border-t border-line bg-ink-950/90 py-10 backdrop-blur-md">
  <div
    class="section-container flex flex-col items-center justify-between gap-6 text-sm text-content-muted sm:flex-row"
  >
    <div
      class="flex flex-col items-center gap-2 text-center sm:items-start sm:text-left"
    >
      <p class="text-content-secondary font-medium">
        &copy; {{ year }}
        <span class="text-content-primary">{{ profile.name }}</span>
        . {{ 'footer.rights' | transloco }}
      </p>
      <span class="font-mono text-xs text-content-disabled">
        {{ 'footer.built' | transloco }}
      </span>
    </div>
    <div class="flex items-center gap-6">
      <a
        [href]="profile.github"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 text-content-muted transition-colors hover:text-brand-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent-400 rounded px-2 py-1"
        [attr.aria-label]="'footer.githubAria' | transloco"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.29-.01-1.05-.02-2.06-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.21.09 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.89-.01 3.29 0 .32.21.7.83.58A12.01 12.01 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"
          />
        </svg>
        <span>{{ 'footer.sourceCode' | transloco }}</span>
      </a>
      <a
        [href]="profile.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2 text-content-muted transition-colors hover:text-brand-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent-400 rounded px-2 py-1"
        [attr.aria-label]="'footer.linkedinAria' | transloco"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.45-2.13 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"
          />
        </svg>
        <span>{{ 'footer.linkedin' | transloco }}</span>
      </a>
    </div>
  </div>
</footer>
