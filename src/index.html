    <script>
      // Applique le thème mémorisé avant la peinture : le rendu serveur sort
      // en sombre, sans ça un visiteur en thème clair verrait un flash.
      (function () {
        try {
          var stored = localStorage.getItem('jf-portfolio.theme');
          document.documentElement.setAttribute(
            'data-theme',
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
